<!-- Set the theme before first paint so the page never flashes dark before
     React mounts — light is the default unless the visitor has already
     switched, in which case their saved choice wins. -->
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    document.documentElement.dataset.theme = saved === "dark" ? "dark" : "light";
  })();
</script>
